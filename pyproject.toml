[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-mvp-dashboard"
version = "0.1.0"
description = "NBA MVP Dashboard using DuckDB and Streamlit"
readme = "README.md"
requires-python = ">=3.8.1"
license = {text = "MIT"}
dependencies = [
    # Data processing libraries
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    
    # Database libraries
    "duckdb>=0.9.0",
    "dbt-duckdb>=1.6.0",
    
    # Web scraping
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",  # Explicitly added for HTML parsing
    
    # Data visualization
    "streamlit>=1.29.0",
    "plotly>=5.18.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    
    # Statistical analysis
    "statsmodels>=0.14.0",
    
    # Other utilities
    "python-dotenv>=1.0.0",
]

[tool.setuptools]
packages = ["scripts", "streamlit_app"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
]

# No UV configuration in pyproject.toml - we'll use command-line options instead

# Adding executable scripts
[project.scripts]
run-dashboard = "streamlit:main.run_command"
